name: bdj_studio_search_pro
description: "BDJ Studio Search Pro - Buscador Instantáneo para DJs y Productores"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^10.1.2
  crypto: ^3.0.3
  cryptography: ^2.7.0
  shared_preferences: ^2.3.4
  hotkey_manager: ^0.2.3
  tray_manager: ^0.2.4
  desktop_drop: ^0.4.4
  url_launcher: ^6.3.0
  window_manager: ^0.3.9

  bdj_license_core:
    path: ../../bdj_license_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

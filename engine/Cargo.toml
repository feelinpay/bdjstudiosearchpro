[workspace]
resolver = "2"
members = [
    "bdj_search_core",
    "bdj_search_fs",
    "bdj_search_ipc",
    "bdj_search_indexer",
    "bdj_search_ffi",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["BDJ Studio <dev@bdjstudio.com>"]
license = "Proprietary"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

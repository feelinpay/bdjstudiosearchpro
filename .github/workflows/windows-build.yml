name: Windows Build & CI

on:
  push:
    branches: [ main, master, 'cierre/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Search Pro
        uses: actions/checkout@v4

      - name: Checkout bdj_license_core
        uses: actions/checkout@v4
        with:
          repository: dzapataba/bdjstudiolicensecore
          token: ${{ secrets.CORE_TOKEN }}
          path: ../bdj_license_core

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Run Engine Tests & Clippy
        run: |
          cd engine
          cargo test --workspace --release
          cargo clippy --workspace -- -D warnings

      - name: Generate FFI bridge & Build Rust (Windows)
        run: powershell -ExecutionPolicy Bypass -File tools/build_native.ps1

      - name: Run Flutter Analyze & Tests
        run: |
          cd frontend
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Flutter Windows Release
        run: |
          cd frontend
          flutter build windows --release

      - name: Build Inno Setup Installer
        run: |
          iscc distribution/installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDJ_Studio_Search_Pro_Windows_Setup
          path: output/*.exe

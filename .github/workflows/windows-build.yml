name: Windows Build & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Search Pro
        uses: actions/checkout@v4

      - name: Checkout bdj_license_core
        uses: actions/checkout@v4
        with:
          repository: dzapataba/bdjstudiolicensecore
          token: ${{ secrets.CORE_TOKEN }}
          path: bdj_license_core

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Run Engine Tests & Clippy
        run: |
          cd engine
          cargo test --workspace --release
          cargo clippy --workspace -- -D warnings

      - name: Generate FRB Bindings & Validate
        run: |
          cd frontend
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Run Flutter Analyze & Tests
        run: |
          cd frontend
          flutter analyze
          flutter test

      - name: Build Windows Executable
        run: |
          cd frontend
          flutter build windows --release

      - name: Build Indexer Service Binary
        run: |
          cd engine
          cargo build --release -p bdj_search_indexer

      - name: Stage Release Artifacts
        run: |
          mkdir -p release_stage
          cp frontend/build/windows/x64/runner/Release/* release_stage/ -Recurse
          cp engine/target/release/bdj_search_indexer.exe release_stage/

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BDJ_Studio_Search_Pro_Windows_x64
          path: release_stage/
